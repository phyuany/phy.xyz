<!DOCTYPE HTML>
<html lang="zh">

<head>
    <title>极客开发者 | algs.tech</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript>
        <link rel="stylesheet" href="assets/css/noscript.css" />
    </noscript>
    <style>
        /* Modal backdrop */
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 240ms ease, visibility 240ms ease;
            pointer-events: none;
        }

        /* When visible */
        .modal.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Modal content with subtle scale/translate animation */
        .modal-content {
            background: transparent;
            margin: 0;
            display: block;
            width: 90%;
            max-width: 320px;
            transform: translateY(20px) scale(0.95);
            transition: transform 300ms cubic-bezier(.2,.8,.2,1), opacity 300ms ease;
            opacity: 0;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border-radius: 8px;
            overflow: visible;
        }

        /* subtle gradient background behind the image */
        .modal-content::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            z-index: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.12) 100%);
        }

        .modal.show .modal-content {
            transform: translateY(0) scale(1);
            opacity: 1;
        }


        #modal-img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 6px;
            position: relative;
            z-index: 1;
        }

        li {
            color: #00e1fff7;
            display: inline-block;
            cursor: pointer;
        }

        .copyright li{
            color: #ffffff;
            text-transform: lowercase;
        }

        @media (max-width: 480px) {
            .modal-content { max-width: 280px; }
        }
    </style>
</head>

<body class="is-loading">

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Main -->
        <section id="main">
            <header>
                <span class="avatar"><img src="images/avatar.jpeg" alt=""
                        style=" height: auto; width:auto; width:150px;" /></span>
                <p>这里是 极客开发者 </p>
                <p>欢迎来到我的的个人主页！</p>
            </header>
            <footer>
                <ol>
                    <li><a href="https://www.zhihu.com/people/jkdev.cn" target="_blank">知乎</a>
                    </li>
                    |
                    <li><a href="https://space.bilibili.com/172353353/#/" target="_blank">B站</a></li>
                    |
                    <li><a type="button" onclick="showImage()">公众号</a></li>
                </ol>
            </footer>
            <br>
        </section>

        <!-- Footer -->
        <footer id="footer">
            <ul class="copyright">
                <li>&copy; algs.tech</li>
                </li>
                <li>
                    <a href="mailto:pan.hy@foxmail.com" target="_blank">邮箱: pan.hy@foxmail.com</a>
                </li>
            </ul>
        </footer>

    </div>

    <div id="myModal" class="modal">
        <div class="modal-content"> <img src="" alt="" id="modal-img" style="width:100%;"> </div>
    </div>

    <script>
        if ('addEventListener' in window) {
            window.addEventListener('load', function () {
                document.body.className = document.body.className.replace(/\bis-loading\b/, '');
            });
            document.body.className += (navigator.userAgent.match(/(MSIE|rv:11\.0)/) ? ' is-ie' : '');
        }

        (function () {
            if (!document.getElementById) return;
            var modal = document.getElementById("myModal");
            var modalImg = document.getElementById("modal-img");

            function showImage() {
                modalImg.src = "../images/wechat.jpg";
                modal.classList.add('show');
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
            }

            function hideModal() {
                modal.classList.remove('show');
                setTimeout(function () {
                    modalImg.src = '';
                    document.documentElement.style.overflow = '';
                    document.body.style.overflow = '';
                }, 350);
            }

            // expose for inline onclick
            window.showImage = showImage;

            // no close button; backdrop click and ESC still close

            // click backdrop to close
            modal.addEventListener('click', function (e) {
                if (e.target === modal) hideModal();
            });

            // ESC to close
            document.addEventListener('keydown', function (e) {
                var key = e.key || e.keyCode;
                if (key === 'Escape' || key === 'Esc' || key === 27) {
                    if (modal.classList.contains('show')) hideModal();
                }
            });
        })();
    </script>

</body>

</html>
